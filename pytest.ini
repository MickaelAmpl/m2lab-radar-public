[pytest]
# `python3 -m pytest -q` only ever means the pytest-native suite under tests/. The
# root-level test_*.py files (test_baseline.py, test_cards.py, ...) are standalone
# scripts run directly (`python3 test_cards.py`) — see README "Checks" and
# docs/TESTING.md. They are plain modules that call sys.exit() at import time, which
# crashes pytest's collector (INTERNALERROR) if it ever tries to import them; scoping
# testpaths to tests/ keeps the two suites from colliding.
testpaths = tests
markers =
    slow: exercises real subprocess/model work; skip for a quick loop (deselect with -m "not slow")
# Public copy: these tests need folders that stay private (artefacts/, studio/, tools/
# with the Node PDF and Remotion toolchain), so they are deselected here.
addopts =
    --deselect tests/test_cardbook.py::test_full_book_builds_to_pdf
    --deselect tests/test_pdf_build.py::test_build_three_chapter_sample
    --deselect tests/test_cards_pipeline.py::test_finalize_valid_card_writes_jobs_frames_db_and_edl
    --deselect tests/test_production.py::test_edl_with_takes_binds_video_layer_and_keeps_contract_valid
    --deselect tests/test_shortlist_adapt.py::test_good_card_validates
